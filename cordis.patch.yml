# dsh bundle patch：把本插件的技能目录接入 DSH 的技能发现链。
#
# 说明：本插件是 skills-only（纯 Markdown 技能），没有运行时代码。
# DSH 的技能由 `@deepseek-ai/dsh-skill-filesystem` 提供方扫描根目录发现。
# 这里做两件事：
#   1. 确保技能提供方已加载；
#   2. 把本插件的 `skills/` 目录注册进 customSkillDirs（rank 300）。
#
# 安装前请把 `<PLUGIN_DIR>` 换成你克隆本仓库的绝对路径，例如：
#   Windows: D:\\dsh-plugins\\dsh-resume-job-search
#   macOS/Linux: /Users/you/dsh-plugins/dsh-resume-job-search
#
# 也可以不改本文件，改为在 $DSH_HOME/profiles/<profile>/cordis.patch.yml 里
# 覆盖同一字段（见 INSTALL.md 的方式 C）。

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - '<PLUGIN_DIR>/skills'
