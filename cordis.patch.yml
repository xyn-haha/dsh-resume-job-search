# dsh bundle patch：把本插件作为一层插入 profile 的插件栈。
#
# 被 `dsh plugin --profile <profile> add <本包>` 安装后，本文件由 profile 的
# bundle 机制自动加载：下面的 insert 让 loader 实例化本包的入口模块
# （package.json 的 main → lib/index.js），入口在 apply() 里把包内 skills/
# 注册为技能提供方，无需用户手工建联接或改 customSkillDirs。
- insert:
    - id: resume-job-search
      name: dsh-resume-job-search
